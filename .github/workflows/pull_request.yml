name: Go
on: pull_request

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.19
      uses: actions/setup-go@v1
      with:
        go-version: 1.19
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v1

    - name: Granting private modules access
      run: |
        git config --global url."https://${{ secrets.GO_MODULES_TOKEN }}:x-oauth-basic@github.com/ernestrc".insteadOf "https://github.com/ernestrc"     

    - name: Get dependencies
      run: |
        go get -v -t -d ./.../...

    - name: Build & Test
      run: make test GOTESTFLAGS="-timeout 240s"
