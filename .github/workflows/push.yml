name: Go
on: push

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.19
      uses: actions/setup-go@v1
      with:
        go-version: 1.19
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v1

    - name: Granting private modules access
      run: |
        git config --global url."https://${{ secrets.GO_MODULES_TOKEN }}:x-oauth-basic@github.com/ernestrc".insteadOf "https://github.com/ernestrc"     

    - name: Get dependencies
      run: |
        go get -v -t -d ./.../...

    - name: Build & Test
      run: make test GOTESTFLAGS="-timeout 240s"


  notify:
    if: always()
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification with workflow result.
        uses: ScribeMD/slack-templates@0.6.38
        with:
          bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel-id: C0727A4EXGB 
          template: result
          results: "${{ join(needs.*.result, ' ') }}"
