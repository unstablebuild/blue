name: Release
on: 
  release:
    types: [created]

jobs:
  release-github:
    name: Release binaries to Github
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [arm64, amd64]
        binary: [gps-server, gps-producer]
    steps:
    - uses: actions/checkout@v2
    - uses: wangyoucao577/go-release-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        goos: ${{ matrix.goos }}
        goarch: ${{ matrix.goarch }}
        project_path: ./cmd/${{ matrix.binary }}
        binary_name: ${{ matrix.binary }}


  release-bluectl:
    name: Release binaries via bluectl release
    runs-on: ubuntu-latest
    steps:

    - name: Checkout git
      uses: actions/checkout@v2

    - name: Make release tarball
      run: make release

    - name: Extract tag name
      id: tag
      uses: actions/github-script@0.2.0
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          return context.payload.ref.replace(/\/refs\/tags\//, '');

    - name: Create bluectl config
      run: echo "auth:\n  project-id: unstable-build-blue-dev\n  credentials-file: \"/home/`whoami`/gcloud.json\"\nrelease:\n  collection: blue-release\n" > ~/.bluectl/config

    - name: Create gcloud creds
      run: echo ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }} | base64 -d > /home/`whoami`/gcloud.json

    - name: Upload release tarball
      run: bin/bluectl release create ${{ steps.tag.outputs.result }} target/blue-release.tar.gz
