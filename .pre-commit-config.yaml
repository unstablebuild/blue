repos:

-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace

-   repo: https://github.com/golangci/golangci-lint
    rev: v1.58.1
    hooks:
    -   id: golangci-lint-full

-   repo: local
    hooks:
    -   id: validate_generate
        language: system
        files: (\.pb.go$|\.proto$)
        name: validate_generate
        # if make generate changes any files, then pre-commit
        # automatically fails
        entry: make generate
