syntax = "proto3";
option go_package = "/pubsubpb";

package proto;

message PublishRequest {
	string topic = 1;
	bytes data = 2;
	string sender = 3;
}

message PublishResponse {
}

message ReceiveMessage {
	message Data {
		string sender = 1;
		bytes data = 2;
	}

	message Request {
		string topic = 1;
	}
	message Ack {
	}
	Ack ack = 1;
	Data data = 2;
	Request req = 3;
}

service PubSub {
	rpc Publish(PublishRequest) returns (PublishResponse);
	rpc Receive(stream ReceiveMessage) returns (stream ReceiveMessage);
}
